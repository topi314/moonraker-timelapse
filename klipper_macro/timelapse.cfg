# Minimal shim for HelixScreen's timelapse enable toggle.
# Full-print H.264 remux is handled by the moonraker timelapse component.
# Slicer may still emit TIMELAPSE_TAKE_FRAME on layer change — that is a no-op.

[gcode_macro TIMELAPSE_TAKE_FRAME]
description: No-op; enable flag synced from HelixScreen / Moonraker
variable_enable: False
gcode:

[gcode_macro _SET_TIMELAPSE_SETUP]
description: Accept Moonraker settings sync; only apply ENABLE
gcode:
  {% if params.ENABLE %}
    {% if params.ENABLE|lower is in ['true', 'false'] %}
      SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=enable VALUE={True if params.ENABLE|lower == 'true' else False}
    {% else %}
      {action_raise_error("ENABLE=%s not supported. Allowed values are [True, False]" % params.ENABLE|capitalize)}
    {% endif %}
  {% endif %}

[gcode_macro _TIMELAPSE_NEW_FRAME]
description: Stub — frame capture disabled
gcode:

[gcode_macro HYPERLAPSE]
description: Stub — unused
variable_run: False
gcode:

[gcode_macro TIMELAPSE_RENDER]
description: Stub — unused
gcode:
